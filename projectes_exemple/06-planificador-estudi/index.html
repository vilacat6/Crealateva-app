<!doctype html>
<html lang="ca"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planificador d'estudi</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:25px;background:#eef3fb;color:#172b48;font:16px/1.5 system-ui,'Segoe UI',sans-serif}main{max-width:800px;margin:10px auto}h1{font-size:clamp(1.9rem,4vw,2.6rem);margin:0}h2{margin:0;font-size:1.23rem}.muted{color:#586d87}.panel{background:white;border:1px solid #d9e3ef;border-radius:17px;padding:23px;margin-top:17px;box-shadow:0 7px 20px #1a426112}form{display:grid;grid-template-columns:1fr 1.5fr .7fr;gap:12px;align-items:end}label{display:block;font-weight:750;margin-bottom:5px}input{width:100%;border:1px solid #aebfd4;border-radius:9px;padding:11px 12px;font:inherit}button{background:#2356c2;color:#fff;font:inherit;font-weight:750;border:0;border-radius:9px;cursor:pointer;padding:11px 14px}button:hover{filter:brightness(.95)}button:focus-visible,input:focus-visible{outline:3px solid #f3a52d;outline-offset:2px}form button{grid-column:1/-1}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.progress{height:15px;border-radius:30px;background:#d7e6f1;overflow:hidden;margin:17px 0 10px}.progress>div{width:0;height:100%;background:#149273;transition:width .2s}.list{list-style:none;padding:0;margin:17px 0 0;display:grid;gap:9px}.task{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid #dbe6f1;border-radius:12px;padding:12px;background:#f8fbff}.task strong{display:block}.task .meta{color:#5a6c84;font-size:.87rem}.task .actions{display:flex;gap:7px;flex-wrap:wrap}.task button{font-size:.85rem;padding:7px 9px}.task button.delete{background:#e9edf4;color:#29425e}.task.done strong{text-decoration:line-through;color:#677589}.empty{border:1px dashed #afc1d5;border-radius:11px;padding:20px;color:#586d87}.footnote{font-size:.91rem;color:#566d84;margin:15px 0}@media(max-width:600px){form{grid-template-columns:1fr}.task{align-items:start;flex-direction:column}.task .actions{width:100%}}
</style></head><body><main>
<h1>📚 Planificador d’estudi</h1><p class="muted">Organitza la feina, marca les tasques fetes i consulta el progrés.</p>
<section class="panel"><h2>➕ Afegeix una tasca</h2><form id="form"><div><label for="subject">Assignatura</label><input id="subject" maxlength="45" placeholder="Ex.: Matemàtiques" required></div><div><label for="task">Què has de fer?</label><input id="task" maxlength="90" placeholder="Ex.: exercicis 3, 4 i 5" required></div><div><label for="minutes">Minuts</label><input id="minutes" type="number" min="1" max="300" value="20" required></div><button type="submit">Afegir a la llista</button></form></section>
<section class="panel"><div class="topline"><h2>Les meves tasques</h2><strong id="counter" aria-live="polite">0 de 0 fetes</strong></div>
<div class="progress" aria-label="Progrés de tasques"><div id="bar"></div></div><p class="muted" id="summary">Afegeix la teva primera tasca per començar.</p><ul id="list" class="list"></ul></section>
<p class="footnote">Aquest exemple funciona sense Internet. Les tasques no queden guardades quan tanques la pàgina.</p>
</main><script>
const tasks=[];let nextId=0;const list=document.getElementById('list');const counter=document.getElementById('counter');
function render(){list.replaceChildren();const done=tasks.filter(t=>t.done).length;const total=tasks.reduce((s,t)=>s+t.minutes,0);
counter.textContent=done+' de '+tasks.length+' fetes';document.getElementById('bar').style.width=(tasks.length?done/tasks.length*100:0)+'%';
document.getElementById('summary').textContent=tasks.length?'Tens '+total+' minuts de feina previstos. Progrés: '+Math.round(done/tasks.length*100)+'%.':'Afegeix la teva primera tasca per començar.';
if(!tasks.length){const p=document.createElement('li');p.className='empty';p.textContent='Encara no hi ha tasques. Escriu-ne una al formulari de dalt.';list.appendChild(p);return;}
for(const t of tasks){const li=document.createElement('li');li.className='task'+(t.done?' done':'');
const info=document.createElement('div');const title=document.createElement('strong');title.textContent=t.task;const meta=document.createElement('div');meta.className='meta';meta.textContent=t.subject+' · '+t.minutes+' min';info.append(title,meta);
const actions=document.createElement('div');actions.className='actions';const toggle=document.createElement('button');toggle.textContent=t.done?'Desmarcar':'Marcar com feta';toggle.addEventListener('click',()=>{t.done=!t.done;render();});
const del=document.createElement('button');del.className='delete';del.textContent='Eliminar';del.addEventListener('click',()=>{tasks.splice(tasks.indexOf(t),1);render();});actions.append(toggle,del);li.append(info,actions);list.appendChild(li);}}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const subject=document.getElementById('subject').value.trim();const task=document.getElementById('task').value.trim();const minutes=Number(document.getElementById('minutes').value);
if(!subject||!task||!Number.isInteger(minutes)||minutes<1||minutes>300)return;tasks.push({id:++nextId,subject,task,minutes,done:false});document.getElementById('task').value='';render();document.getElementById('task').focus();});render();
</script></body></html>
