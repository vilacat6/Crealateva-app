<!doctype html>
<html lang="ca"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Penal Master - Joc de penals</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d182b;color:white;font:17px/1.5 system-ui,'Segoe UI',sans-serif;padding:22px}main{max-width:750px;margin:18px auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(2rem,5vw,3rem);margin:0}p{color:#d9e9ff;margin:8px 0 18px}.pill{border:1px solid #45775f;background:#17382d;padding:8px 14px;border-radius:20px;font-weight:800}.pitch{position:relative;height:280px;background:linear-gradient(#17834b,#0f633d);border:4px solid #b2e5c7;border-radius:20px;margin:18px 0 16px;overflow:hidden}.goal{position:absolute;top:18px;left:15%;width:70%;height:157px;border:7px solid white;border-bottom:0;border-radius:7px 7px 0 0;background:repeating-linear-gradient(90deg,#ffffff21 0,#ffffff21 2px,transparent 2px,transparent 30px),repeating-linear-gradient(0deg,#ffffff21 0,#ffffff21 2px,transparent 2px,transparent 28px)}.keeper{position:absolute;top:104px;left:50%;transform:translateX(-50%);font-size:60px;transition:left .32s ease}.ball{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:44px}.board{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}.score{font-weight:900;font-size:1.3rem}.status{padding:15px 17px;background:#142b44;border-radius:12px;min-height:62px;margin:14px 0}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}button{padding:14px 8px;border:0;border-radius:12px;font:inherit;font-weight:800;cursor:pointer;background:#f3fa7c;color:#172025}button:hover{filter:brightness(.93)}button:disabled{background:#758697;color:#e9f0f7;cursor:not-allowed}button:focus-visible{outline:4px solid #ffffff;outline-offset:3px}.restart{background:#e3efff;color:#142b44;margin-top:12px}.detail{font-size:.9rem;color:#c5e3d8}.bar{height:10px;background:#233d56;border-radius:12px;margin:10px 0;overflow:hidden}.bar>div{height:100%;width:0;background:#f3fa7c;transition:width .2s}@media(max-width:480px){.controls{grid-template-columns:1fr}.pitch{height:230px}.goal{height:126px}.keeper{top:83px}}
</style></head><body><main>
<header><div><h1>⚽ Penal Master</h1><p>Tria on xutar. Tens cinc penals per marcar tants gols com puguis.</p></div><span class="pill" id="round">Xut 1 de 5</span></header>
<div class="pitch" aria-label="Camp amb una porteria i un porter"><div class="goal"></div><div class="keeper" id="keeper" aria-hidden="true">🧤</div><div class="ball" aria-hidden="true">⚽</div></div>
<div class="board"><span class="score" id="score">Gols: 0 / 5</span><span class="detail">Escull una direcció per xutar</span></div><div class="bar" aria-hidden="true"><div id="progress"></div></div>
<div class="status" id="message" role="status">A punt? El porter es mourà quan xutis.</div>
<div class="controls"><button class="kick" data-side="0">⬅ Esquerra</button><button class="kick" data-side="1">⬆ Centre</button><button class="kick" data-side="2">Dreta ➡</button></div>
<button class="restart" id="restart">↻ Tornar a jugar</button><p class="detail">Funciona sense Internet. No desa resultats quan tanques la pàgina.</p>
</main><script>
let shots=0,goals=0;const sides=['esquerra','centre','dreta'];const keeper=document.getElementById('keeper');
const msg=document.getElementById('message'),round=document.getElementById('round'),score=document.getElementById('score');
function kick(side){if(shots>=5)return;const defense=Math.floor(Math.random()*3);keeper.style.left=['30%','50%','70%'][defense];shots++;const goal=side!==defense;if(goal)goals++;msg.textContent=goal?'GOL! Xut a la '+sides[side]+' i porter cap a '+sides[defense]+'.':'PARADA! El porter ha encertat la direcció.';
score.textContent='Gols: '+goals+' / 5';document.getElementById('progress').style.width=(shots*20)+'%';round.textContent=shots===5?'Partida acabada':'Xut '+(shots+1)+' de 5';
if(shots===5){msg.textContent+=' Final: '+goals+' gols de 5. '+(goals>=3?'Gran partit!':'Pots tornar-ho a provar!');document.querySelectorAll('.kick').forEach(b=>b.disabled=true);}}
document.querySelectorAll('.kick').forEach(b=>b.addEventListener('click',()=>kick(Number(b.dataset.side))));
document.getElementById('restart').addEventListener('click',()=>{shots=0;goals=0;keeper.style.left='50%';score.textContent='Gols: 0 / 5';round.textContent='Xut 1 de 5';msg.textContent='A punt? El porter es mourà quan xutis.';document.getElementById('progress').style.width='0%';document.querySelectorAll('.kick').forEach(b=>b.disabled=false);});
</script></body></html>
